[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfisca-nl"
version = "0.1.0"
description = "OpenFisca rules for Dutch allowances, student finance and Maastricht local support - powering Eli Check (eli-check.nl)."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = [
    "openfisca-core[web-api]>=46,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["openfisca_nl*"]

[tool.setuptools.package-data]
# variables/ has no __init__.py (OpenFisca loads it as a directory), so ship its files as data.
openfisca_nl = ["parameters/**/*.yaml", "variables/*.py", "tests/**/*.yaml"]
