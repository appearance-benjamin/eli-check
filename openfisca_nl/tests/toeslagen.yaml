# Official worked examples from the Belastingdienst "Berekening ... 2026" PDFs
# (see docs/research/toeslagen-2026.md for sources and the two PDF typos corrected here).

- name: ZT-1 zorgtoeslag, single, income 19,000
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    personen:
      a:
        leeftijd: 30
        inkomen_uit_arbeid:
          2026: 19000
    huishoudens:
      h:
        partners: [a]
  output:
    zorgtoeslag_jaarbedrag: 1550.45
    zorgtoeslag: 129

- name: ZT-2 zorgtoeslag, partners 7,000 + 26,200, partner not insured (50%)
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    personen:
      a:
        leeftijd: 40
        inkomen_uit_arbeid:
          2026: 7000
      b:
        leeftijd: 40
        heeft_nederlandse_zorgverzekering: false
        inkomen_uit_arbeid:
          2026: 26200
    huishoudens:
      h:
        partners: [a, b]
  output:
    zorgtoeslag_jaarbedrag: 1243.51
    zorgtoeslag: 103

- name: ZT-4/5 zorgtoeslag maximum, single and partners without income
  period: 2026-10
  input:
    personen:
      a:
        leeftijd: 21
      b:
        leeftijd: 22
      c:
        leeftijd: 23
    huishoudens:
      single:
        partners: [a]
      couple:
        partners: [b, c]
  output:
    zorgtoeslag: [129, 246]

- name: ZT-6 zorgtoeslag income limit follows from the 24 euro minimum (40,857 paid, 40,858 not)
  period: 2026-01
  input:
    personen:
      a:
        leeftijd: 30
        inkomen_uit_arbeid:
          2026: 40857
      b:
        leeftijd: 30
        inkomen_uit_arbeid:
          2026: 40858
    huishoudens:
      h1:
        partners: [a]
      h2:
        partners: [b]
  output:
    zorgtoeslag: [1, 0]
    zorgtoeslag_voorwaarde_inkomen: [true, false]

- name: Zorgtoeslag needs a Dutch health insurance (EU student on EHIC only)
  period: 2026-10
  input:
    personen:
      a:
        leeftijd: 20
        heeft_nederlandse_zorgverzekering: false
    huishoudens:
      h:
        partners: [a]
  output:
    zorgtoeslag_voorwaarde_verzekering: false
    zorgtoeslag: 0

- name: Zorgtoeslag not for under 18
  period: 2026-10
