    personen:
      a:
        leeftijd: 17
    huishoudens:
      h:
        partners: [a]
  output:
    zorgtoeslag: 0

- name: HT-1 huurtoeslag, single aged 20, rent 600, income 22,000 (youth cap 498.20)
  period: 2026-01
  absolute_error_margin: 0.01
  input:
    personen:
      a:
        leeftijd: 20
        inkomen_uit_arbeid:
          2026: 22000
    huishoudens:
      h:
        partners: [a]
        huur_per_maand: 600
        zelfstandige_woonruimte: true
  output:
    huurtoeslag_huurgrens: 498.20
    huurtoeslag_ongeafrond: 295.68
    huurtoeslag: 295

