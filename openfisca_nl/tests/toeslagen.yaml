- name: Rent above the cap no longer blocks huurtoeslag in 2026 (capped at 932.93)
  period: 2026-10
  absolute_error_margin: 0.01
  input:
    personen:
      a:
        leeftijd: 25
    huishoudens:
      h:
        partners: [a]
        huur_per_maand: 1100
        zelfstandige_woonruimte: true
  output:
    # A 295.68 + B 0.65 * 214.82 + C 0.40 * 219.91, no income correction
    huurtoeslag_ongeafrond: 523.28
    huurtoeslag: 523

