- name: EU students — 32 h/month, more than 24 h for 6+ months, or enough earnings count as migrant worker
  period: 2026-10
  input:
    personen:
      uren32:
        leeftijd: 21
        onderwijs: wo
        nationaliteit: eer
        werkuren_per_maand: 32
        inkomen_uit_arbeid:
          2026: 4000
      uren25:
        leeftijd: 21
        onderwijs: wo
        nationaliteit: eer
        werkuren_per_maand: 25
        maanden_gewerkt:
          2026: 8
        inkomen_uit_arbeid:
          2026: 2600
      verdienen:
        leeftijd: 22
        onderwijs: hbo
        nationaliteit: eer
        werkuren_per_maand: 20
        inkomen_uit_arbeid:
          2026: 9000
      te_weinig:
        leeftijd: 21
        onderwijs: wo
        nationaliteit: eer
        werkuren_per_maand: 20
        inkomen_uit_arbeid:
          2026: 3000
    huishoudens:
      h1:
        partners: [uren32]
      h2:
        partners: [uren25]
      h3:
        partners: [verdienen]
      h4:
        partners: [te_weinig]
  output:
    is_migrerend_werknemer: [true, true, true, false]
    recht_op_studiefinanciering: [true, true, true, false]
    # EU students without worker status can still borrow for tuition
    collegegeldkrediet: [224.50, 224.50, 224.50, 224.50]

