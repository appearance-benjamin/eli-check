# Aanvullende beurs cases follow DUO's 2026 calculation forms (docs/research/studiefinanciering-2026.md, section 2.3).

- name: A — HO student living away, parents 30,000 + 25,000
  period: 2026-10
  absolute_error_margin: 0.01
  input:
    personen:
      s:
        leeftijd: 19
        onderwijs: wo
        inkomen_ouders:
          2026: 55000
    huishoudens:
      h:
        partners: [s]
  output:
    recht_op_studiefinanciering: true
    basisbeurs: 324.52
    ouderbijdrage_per_maand: 152.99
    aanvullende_beurs: 338.09
    maximale_lening: 468.16
    collegegeldkrediet: 224.50
    studentenreisproduct: true
    studentenreisproduct_waarde: 110.95

- name: B — two children with aanvullende beurs share the parental contribution
