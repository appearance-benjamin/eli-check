description: Studiefinanciering (Wet studiefinanciering 2000) and tegemoetkoming scholieren (Wtos)
metadata:
  reference:
    - title: DUO — Bedragen studiefinanciering
      href: https://duo.nl/particulier/studiefinanciering/bedragen.jsp
    - title: Wsf 2000 art. 3.18 (normbedragen per 1 januari 2026)
      href: https://wetten.overheid.nl/BWBR0011453/2026-08-01/0/Hoofdstuk3/Paragraaf3.5/Artikel3.18
    - title: DUO — Berekening aanvullende beurs hbo/universiteit 2026
      href: https://duo.nl/images/folder-berekening-aanvullende-beurs-hbo-universiteit-2026.pdf
    - title: DUO — Berekening aanvullende beurs mbo 2026
      href: https://duo.nl/images/folder-berekening-aanvullende-beurs-mbo-2026.pdf
maximumleeftijd:
  description: Studiefinanciering must start before this age (Wsf art. 2.3)
  metadata:
    unit: year
  values:
    2025-01-01:
      value: 30
eer_verblijfsjaren:
  description: EU/EEA/Swiss citizens are treated as Dutch after this many years of uninterrupted residence
  metadata:
    unit: year
    reference:
      - title: DUO — Voorwaarden voor burgers van de EU, EER, Zwitserland of VK
        href: https://duo.nl/particulier/studiefinanciering-burgers-eu-eer-zwitserland-of-vk/voorwaarden.jsp
  values:
    2025-01-01:
      value: 5
migrerend_werknemer:
  description: DUO presumption of EU migrant-worker status (Beleidsregel BWBR0049680, from 1 September 2023)
  metadata:
    reference:
      - title: Beleidsregel migrerend werknemerschap en studiefinanciering
        href: https://wetten.overheid.nl/BWBR0049680/2024-05-09
      - title: CRvB 14-04-2023, ECLI:NL:CRVB:2023:700 (56 hours was too strict)
        href: https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:CRVB:2023:700
  minimum_uren_per_maand:
    description: Average hours of work per month
    metadata:
      unit: hour
    values:
      2023-09-01:
        value: 32
  minimum_uren_zes_maanden:
    description: Alternative — more than this many hours per month, for at least 6 months
    metadata:
      unit: hour
    values:
      2023-09-01:
        value: 24
  minimum_netto_maandinkomen:
    description: Alternative — average net earnings per month of at least 50% of the bijstandsnorm
    metadata:
      reference:
        - title: DUO — Voorwaarden EU-studenten (50% bijstandsnorm 2026)
          href: https://duo.nl/particulier/studiefinanciering-burgers-eu-eer-zwitserland-of-vk/voorwaarden.jsp
    vanaf_21:
      description: Aged 21 or older
      metadata:
        unit: currency-EUR
      values:
        2026-01-01:
          value: 700.75
    onder_21:
      description: Younger than 21
      metadata:
        unit: currency-EUR
      values:
        2026-01-01:
          value: 173
