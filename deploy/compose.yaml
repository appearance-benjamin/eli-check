# Eli Check on a server with Docker: the app (built from this repository) behind Caddy,
# which serves eli-check.nl on ports 80/443 and gets its HTTPS certificates automatically.
# Start or update: ./update.sh
name: eli-check

services:
  app:
    build: ..
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
