<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>See what you're eligible for</title>
  <meta name="description" content="Answer a few simple questions and see which Dutch allowances, student grants and Maastricht support you're likely eligible for. Built on OpenFisca.">
  <meta name="theme-color" content="#fbfbfd">
  <script>
    // Set the theme before the first paint: saved choice, else the system setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("elicheck.theme"); } catch (e) {}
      var theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#000000" : "#fbfbfd";
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="aurora"></div></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">Eli Check</a>
      <div class="topbar-actions">
        <div class="seg seg-small" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="nl">NL</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2 M12 19.5v2 M4.6 4.6 6 6 M18 18l1.4 1.4 M2.5 12h2 M19.5 12h2 M4.6 19.4 6 18 M18 6l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <p id="footer-text"></p>
    <p class="footer-links">
      <a id="source-link" href="https://github.com/appearance-benjamin/eli-check" target="_blank" rel="noopener noreferrer">Source code</a> · AGPL-3.0
    </p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
